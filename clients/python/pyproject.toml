[project]
name = "cortexdb-client"
version = "0.1.1"
description = "Typed gRPC client for CortexDB (AI memory + knowledge graph sidecar)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Liang Li" }]
keywords = ["cortexdb", "rag", "knowledge-graph", "grpc", "ai", "agent-memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.urls]
Homepage = "https://github.com/liliang-cn/cortexdb"
Repository = "https://github.com/liliang-cn/cortexdb"

[project.optional-dependencies]
dev = ["grpcio-tools>=1.60", "build", "twine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortexdb_client"]
