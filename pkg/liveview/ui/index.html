<!doctype html>
<html lang="en">
  <head>
    <base href="/" data-cortexdb-base />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>CortexDB</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <script>
      // Pick the theme before first paint so there is no flash of the wrong
      // one. Light unless a person chose otherwise; "auto" is never the default.
      (function () {
        var mode = "light";
        try {
          var q = new URLSearchParams(location.search).get("mode");
          var s = localStorage.getItem("cortexdb.liveview.mode");
          var pick = q || s;
          if (pick === "dark" || pick === "auto" || pick === "light") mode = pick;
        } catch (e) {}
        var dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        // The same for the language (lib/i18n.ts): ?lang=, the saved choice, the browser.
        var lang = "";
        try {
          var saved = localStorage.getItem("cortexdb.liveview.lang");
          lang = new URLSearchParams(location.search).get("lang") || (saved === "en" || saved === "zh" ? saved : "");
        } catch (e) {}
        lang = lang || navigator.language || "en";
        document.documentElement.lang = lang.toLowerCase().indexOf("zh") === 0 ? "zh-CN" : "en";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
