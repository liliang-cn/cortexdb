name: CI

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run library tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify library can be imported
        run: go list -m github.com/liliang-cn/cortexdb/v2

      - name: Check version consistency
        run: |
          extract() { sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -n1; }
          go_ver=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' version.go)
          claude_ver=$(extract plugins/cortexdb/.claude-plugin/plugin.json)
          codex_ver=$(extract plugins/cortexdb/.codex-plugin/plugin.json)
          market_ver=$(extract .claude-plugin/marketplace.json)
          echo "version.go=$go_ver claude=$claude_ver codex=$codex_ver marketplace=$market_ver"
          for v in "$claude_ver" "$codex_ver" "$market_ver"; do
            if [ "$v" != "$go_ver" ]; then
              echo "::error::Version mismatch: version.go ($go_ver) must match all plugin manifests. The MCP launcher pins its binary download to the plugin version, so a stale manifest ships a stale server."
              exit 1
            fi
          done

      - name: Check examples compile (without running)
        run: |
          for dir in examples/*/; do
            echo "Checking $dir"
            cd "$dir"
            go build -o /dev/null .
            cd - > /dev/null
          done

  rust-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust

      - name: Build sidecar
        run: go build -o clients/rust/target/cortexdb-grpc ./cmd/cortexdb-grpc

      - name: Lint
        working-directory: clients/rust
        run: |
          cargo fmt --check
          cargo clippy --all-features -- -D warnings

      - name: Test
        working-directory: clients/rust
        env:
          CORTEXDB_GRPC_BIN: ${{ github.workspace }}/clients/rust/target/cortexdb-grpc
        run: cargo test --all-features

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-sidecar:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build sidecar binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/cortexdb-grpc${ext}" ./cmd/cortexdb-grpc
          tar -czf "dist/cortexdb-grpc_${GOOS}_${GOARCH}.tar.gz" -C dist "cortexdb-grpc${ext}"
          (cd dist && shasum -a 256 "cortexdb-grpc_${GOOS}_${GOARCH}.tar.gz" > "cortexdb-grpc_${GOOS}_${GOARCH}.tar.gz.sha256")
          # MCP server binary — raw, named for the plugin launcher to download directly
          go build -trimpath -ldflags="-s -w" -o "dist/cortexdb-mcp-${GOOS}-${GOARCH}${ext}" ./cmd/cortexdb-mcp-stdio
          (cd dist && shasum -a 256 "cortexdb-mcp-${GOOS}-${GOARCH}${ext}" > "cortexdb-mcp-${GOOS}-${GOARCH}${ext}.sha256")

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cortexdb-grpc_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/cortexdb-grpc_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
            dist/cortexdb-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
            dist/cortexdb-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
