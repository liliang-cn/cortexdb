name: CI

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      # 25 minutes rather than go test's default 10: under -race and coverage on a
      # shared runner the biggest packages take most of ten minutes, and runner
      # speed varies by a third between runs.
      - name: Run library tests
        run: go test -v -race -timeout 25m -coverprofile=coverage.txt -covermode=atomic ./...

      # Tests that skip themselves under -race because they are single-goroutine
      # and heavy enough that the race detector only makes them slow, or count
      # allocations, which the race detector adds to.
      - name: Run race-exempt tests
        run: go test -count=1 -run 'TestALargeUpsertDoesNotExhaustTheSQLPlaceholders|TestFindNodesFoldsEachNodeOnceACall' ./pkg/cortexdb

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify library can be imported
        run: go list -m github.com/liliang-cn/cortexdb/v2

      - name: Check version consistency
        run: |
          extract() { sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -n1; }
          go_ver=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' version.go)
          claude_ver=$(extract plugins/cortexdb/.claude-plugin/plugin.json)
          codex_ver=$(extract plugins/cortexdb/.codex-plugin/plugin.json)
          live_ver=$(extract plugins/cortexdb-live/.claude-plugin/plugin.json)
          market_ver=$(extract .claude-plugin/marketplace.json)
          dsh_ver=$(extract plugins/dsh-cortexdb-memory/package.json)
          obsidian_ver=$(extract plugins/obsidian-cortexdb/manifest.json)
          obsidian_pkg_ver=$(extract plugins/obsidian-cortexdb/package.json)
          echo "version.go=$go_ver claude=$claude_ver codex=$codex_ver live=$live_ver marketplace=$market_ver dsh=$dsh_ver obsidian=$obsidian_ver/$obsidian_pkg_ver"
          for v in "$claude_ver" "$codex_ver" "$live_ver" "$market_ver" "$dsh_ver" "$obsidian_ver" "$obsidian_pkg_ver"; do
            if [ "$v" != "$go_ver" ]; then
              echo "::error::Version mismatch: version.go ($go_ver) must match all plugin manifests. The MCP launcher pins its binary download to the plugin version, so a stale manifest ships a stale server."
              exit 1
            fi
          done

      - name: Check examples compile (without running)
        run: |
          for dir in examples/*/; do
            echo "Checking $dir"
            cd "$dir"
            go build -o /dev/null .
            cd - > /dev/null
          done

  rust-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust

      - name: Build sidecar
        run: go build -o clients/rust/target/cortexdb-grpc ./cmd/cortexdb-grpc

      - name: Lint
        working-directory: clients/rust
        run: |
          cargo fmt --check
          cargo clippy --all-features -- -D warnings

      - name: Test
        working-directory: clients/rust
        env:
          CORTEXDB_GRPC_BIN: ${{ github.workspace }}/clients/rust/target/cortexdb-grpc
        run: cargo test --all-features

  dsh-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dsh-cortexdb-memory
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test
        run: |
          npm ci --ignore-scripts
          npm test

  obsidian-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/obsidian-cortexdb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test and build
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build

  # The live view's frontend is embedded into the Go binary from the committed
  # pkg/liveview/dist, so `go install` needs no Node. This job keeps that copy
  # honest: a source change that was not rebuilt fails here.
  liveview-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/liveview/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Type check, test and build
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build

      - name: Committed dist matches the source
        working-directory: .
        run: |
          git add -N pkg/liveview/dist
          git diff --exit-code --stat -- pkg/liveview/dist

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-sidecar:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build sidecar binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/cortexdb-grpc${ext}" ./cmd/cortexdb-grpc
          tar -czf "dist/cortexdb-grpc_${GOOS}_${GOARCH}.tar.gz" -C dist "cortexdb-grpc${ext}"
          (cd dist && shasum -a 256 "cortexdb-grpc_${GOOS}_${GOARCH}.tar.gz" > "cortexdb-grpc_${GOOS}_${GOARCH}.tar.gz.sha256")
          # MCP server binary — raw, named for the plugin launcher to download directly
          go build -trimpath -ldflags="-s -w" -o "dist/cortexdb-mcp-${GOOS}-${GOARCH}${ext}" ./cmd/cortexdb-mcp-stdio
          (cd dist && shasum -a 256 "cortexdb-mcp-${GOOS}-${GOARCH}${ext}" > "cortexdb-mcp-${GOOS}-${GOARCH}${ext}.sha256")

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cortexdb-grpc_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            dist/cortexdb-grpc_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
            dist/cortexdb-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
            dist/cortexdb-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-obsidian:
    needs: [release, obsidian-plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Package the Obsidian plugin
        working-directory: plugins/obsidian-cortexdb
        run: |
          npm ci --ignore-scripts
          npm run build
          mkdir -p dist/cortexdb
          cp main.js manifest.json styles.css dist/cortexdb/
          (cd dist && zip -r cortexdb-obsidian.zip cortexdb && shasum -a 256 cortexdb-obsidian.zip > cortexdb-obsidian.zip.sha256)

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugins/obsidian-cortexdb/dist/cortexdb-obsidian.zip
            plugins/obsidian-cortexdb/dist/cortexdb-obsidian.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
